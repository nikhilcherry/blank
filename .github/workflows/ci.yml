name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # One old/new pair per non-Linux OS is enough signal for a stdlib-only tool.
          - os: macos-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # blank analyses history; a shallow clone has none

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Analyse this repository with itself
        run: |
          python -m blank stats .
          python -m blank scan . -o blank-report.html --json blank-report.json \
            --markdown blank-report.md

      - name: Publish the summary to the job page
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cat blank-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: blank-report
          path: |
            blank-report.html
            blank-report.json
            blank-report.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install ruff
      - run: ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Install the wheel and run the console script
        run: |
          python -m pip install dist/*.whl
          blank --version
          blank stats .

  action:
    name: Exercise the bundled action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the action from this very checkout, so a broken action.yml fails CI.
      - uses: ./
        id: blank
        with:
          min-bus-factor: "1"

      - name: Assert the action produced what it promises
        shell: bash
        run: |
          set -euo pipefail
          test -s blank-report.html
          test -s blank-report.json
          echo "bus factor: ${{ steps.blank.outputs.bus-factor }}"
          echo "top risk:   ${{ steps.blank.outputs.top-risk }}"
          test -n "${{ steps.blank.outputs.bus-factor }}"
